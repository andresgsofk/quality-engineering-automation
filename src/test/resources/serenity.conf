serenity.browser.maximized = true

serenity {

  project.name = "Credit Simulator WEB + API Automation Framework"
  encoding = "UTF-8"
  compress.filenames = true
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
  console.colors = true

  # Timeout global de Serenity
  timeout = 20000

  # Reinicia el navegador por cada escenario para aislar pruebas E2E
  restart.browser.for.each = scenario
  restart.browser.frequency = 1

  # Ejecución estable para evitar flakiness en pruebas E2E
  concurrent.executions = 1
  maintain.session = false
  use.unique.browser = true

  report {
    show.manual.tests = false
  }

  browser {
    maximized = true
  }
}

webdriver {

  driver = chrome
  autodownload = true
  base.url = "#{environment.baseUrl}"

  # Timeouts base para estabilidad
  timeouts {
    implicitlywait = 5000
    fluentwait = 15000
    pageload = 30000
    script = 30000
  }

  wait {
    for {
      timeout = 15000
    }
  }

  capabilities {

    browserName = "chrome"
    acceptInsecureCerts = true
    unhandledPromptBehavior = "dismiss"
    pageLoadStrategy = "normal"

    "goog:chromeOptions" {
      args = [
        "--disable-blink-features=AutomationControlled",
        "--start-maximized",
        "--lang=es",
        "--remote-allow-origins=*",
        "--disable-dev-shm-usage",
        "--no-sandbox",
        "--disable-gpu",
        "--disable-popup-blocking",
        "--disable-notifications",
        "--disable-extensions",
        "--disable-infobars",

        # Perfil persistente para conservar aceptación de cookies/local storage.
        # Primera ejecución: aceptar cookies manualmente una vez.
        # Siguientes ejecuciones: Chrome reutiliza el consentimiento y evita el banner OneTrust.
        "--user-data-dir=C:/chrome-serenity-profile-pichincha"
      ]

      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "profile.default_content_settings.cookies" = 1
        "profile.default_content_settings.local_storage" = 1
        "profile.default_content_setting_values.notifications" = 2
      }
    }
  }
}

headless.mode = false

environments {

  default {
    webdriver.base.url = "https://qa.credit-simulator.com"
  }

  qa {
    webdriver.base.url = "https://qa.credit-simulator.com"
  }

  dev {
    webdriver.base.url = "https://dev.credit-simulator.com"
  }

  staging {
    webdriver.base.url = "https://staging.credit-simulator.com"
  }

  prod {
    webdriver.base.url = "https://credit-simulator.com"
  }
}
